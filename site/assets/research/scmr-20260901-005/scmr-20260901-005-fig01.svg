<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">トークン化株式は、公開直後から金融部品として再利用され始めた</title><desc id="desc">Coinbase Tokenized Stocksがウォレットから取引、貸出、金利差運用、LP、複合運用商品へ接続される構造図。矢印は資金量を示さない。</desc><rect width="1200" height="675" fill="white"/><g font-family="sans-serif" fill="#222"><text x="60" y="70" font-size="30" font-weight="700">トークン化株式は、公開直後から金融部品として再利用され始めた</text><text x="60" y="105" font-size="16">Observed integrations + analytical structure / as of 2026-09-01</text></g><g stroke="#777" stroke-width="2" fill="none"><path d="M245 260 H365"/><path d="M535 260 H650"/><path d="M535 260 C600 260 600 170 650 170"/><path d="M535 260 C600 260 600 350 650 350"/><path d="M820 170 H930"/><path d="M820 260 H930"/><path d="M820 350 H930"/></g><g font-family="sans-serif" text-anchor="middle"><g><rect x="55" y="205" width="190" height="110" rx="8" fill="#f2f2f2" stroke="#444"/><text x="150" y="245" font-size="18" font-weight="700">Coinbase</text><text x="150" y="272" font-size="18">Tokenized Stocks</text><text x="150" y="298" font-size="15">B20 / 1:1 share backing</text></g><g><rect x="365" y="215" width="170" height="90" rx="8" fill="#f7f7f7" stroke="#444"/><text x="450" y="252" font-size="18" font-weight="700">自己管理</text><text x="450" y="279" font-size="18">ウォレット</text></g><g><rect x="650" y="125" width="170" height="90" rx="8" fill="#f7f7f7" stroke="#444"/><text x="735" y="162" font-size="18" font-weight="700">DEX / LP</text><text x="735" y="189" font-size="15">Aerodrome</text></g><g><rect x="650" y="215" width="170" height="90" rx="8" fill="#f7f7f7" stroke="#444"/><text x="735" y="250" font-size="18" font-weight="700">貸出・担保</text><text x="735" y="278" font-size="14">Aave / Morpho / Euler</text></g><g><rect x="650" y="305" width="170" height="90" rx="8" fill="#f7f7f7" stroke="#444"/><text x="735" y="340" font-size="18" font-weight="700">金利差運用</text><text x="735" y="368" font-size="14">Superform / TAU</text></g><g><rect x="930" y="125" width="200" height="90" rx="8" fill="#f2f2f2" stroke="#444"/><text x="1030" y="162" font-size="18" font-weight="700">LP自動運用</text><text x="1030" y="189" font-size="15">Beefy CLM</text></g><g><rect x="930" y="215" width="200" height="90" rx="8" fill="#f2f2f2" stroke="#444"/><text x="1030" y="252" font-size="18" font-weight="700">株式担保信用市場</text><text x="1030" y="279" font-size="15">USDC lending</text></g><g><rect x="930" y="305" width="200" height="90" rx="8" fill="#f2f2f2" stroke="#444"/><text x="1030" y="342" font-size="18" font-weight="700">複合運用商品</text><text x="1030" y="369" font-size="15">vault / portfolio</text></g></g><g font-family="sans-serif" fill="#555"><text x="60" y="565" font-size="15">Source: Base official Tokenized Stocks overview / ecosystem listing; Beefy, Superform, TAU public materials.</text><text x="60" y="590" font-size="15">Method: 接続先は観測事実を分類。矢印は概念的な接続を示し、実際の資金量・順序を表さない。</text><text x="60" y="615" font-size="15">Data as of: 2026-09-01</text></g></svg>