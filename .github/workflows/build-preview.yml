name: Build Preview Artifact

on:
  pull_request:
    paths:
      - 'site/**'
      - 'publishing/**'
      - 'scripts/**'
      - '.github/workflows/build-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate automatic Market Watch contract
        run: python3 scripts/validate_auto_brief.py publishing/fixtures/auto-brief-base-valid.json --now 2026-09-01T23:55:00+09:00
      - name: Build registry-driven preview
        run: python3 scripts/build_publication_site.py --preview
      - name: Validate required site files
        shell: bash
        run: |
          set -euo pipefail
          test -f site/index.html
          test -f site/ja/index.html
          test -f site/en/index.html
          test -f site/ja/feed.xml
          test -f site/en/feed.xml
          test -f site/feed.xml
          test -f site/ja/market-watch/index.html
          test -f site/en/market-watch/index.html
          test -f site/ja/series/base-tokenized-stock-yield-watch/index.html
          test -f site/en/series/base-tokenized-stock-yield-watch/index.html
          test -f site/assets/site.css
          test -f site/assets/tokens.css
          test -f site/robots.txt
          test -f site/sitemap.xml
          ! grep -RInE '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|api[_-]?key[[:space:]]*[:=]|private[_-]?key[[:space:]]*[:=]|seed phrase)' site
      - name: Check local href/src targets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlparse
          root=Path('site'); errors=[]
          class Parser(HTMLParser):
              def __init__(self,page): super().__init__(); self.page=page
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  for key in ('href','src'):
                      value=d.get(key)
                      if not value or value.startswith(('#','mailto:','tel:','data:')): continue
                      u=urlparse(value)
                      if u.scheme or u.netloc: continue
                      target=(self.page.parent/u.path).resolve()
                      try: target.relative_to(root.resolve())
                      except ValueError: continue
                      if u.path.endswith('/'): target=target/'index.html'
                      if not target.exists(): errors.append(f'{self.page}: {key}={value} -> missing {target}')
          for page in root.rglob('*.html'):
              p=Parser(page); p.feed(page.read_text(encoding='utf-8'))
          if errors: print('\n'.join(errors)); raise SystemExit(1)
          PY
      - name: Package site preview
        uses: actions/upload-artifact@v4
        with:
          name: signa-et-structura-site-preview
          path: site/
          if-no-files-found: error
          retention-days: 14
